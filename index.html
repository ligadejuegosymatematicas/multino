<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dominó múltiplo de 5 jugable en modos Tradicional, Puertos y Grafo.">
    <title>Dominó múltiplo de 5</title>
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/layout.css">
    <link rel="stylesheet" href="./src/css/board.css">
    <link rel="stylesheet" href="./src/css/traditional.css">
    <link rel="stylesheet" href="./src/css/ports.css">
    <link rel="stylesheet" href="./src/css/components.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Ir al contenido</a>
    <main id="main-content" class="app-shell">
      <header class="app-header">
        <h1>Dominó <span>×5</span></h1>
        <p id="session-badge" class="session-badge">Múltiplos de 5</p>
      </header>

      <section id="setup-screen" class="setup-screen" aria-labelledby="setup-heading">
        <form id="setup-form" class="setup-card">
          <div>
            <h2 id="setup-heading">Nueva partida</h2>
            <p class="setup-intro">Elige los chanchos especiales y cómo quieres ver el tablero.</p>
          </div>

          <label class="setup-field" for="setup-k">
            <span>Chanchos especiales</span>
            <select id="setup-k" name="K">
              <option value="0">K = 0</option>
              <option value="1">K = 1</option>
              <option value="2">K = 2</option>
              <option value="3">K = 3</option>
              <option value="4">K = 4</option>
              <option value="5">K = 5</option>
              <option value="6">K = 6</option>
              <option value="7" selected>K = 7</option>
            </select>
            <small>Los primeros K chanchos colocados en la línea principal pueden recibir hasta cuatro conexiones.</small>
          </label>

          <fieldset class="setup-field">
            <legend>Vista inicial</legend>
            <div class="setup-choice" role="group" aria-label="Vista inicial del tablero">
              <label>
                <input type="radio" name="initial-view-mode" value="graph">
                <span>Grafo</span>
              </label>
              <label>
                <input type="radio" name="initial-view-mode" value="traditional" checked>
                <span>Tradicional</span>
              </label>
              <label>
                <input type="radio" name="initial-view-mode" value="ports">
                <span>Puertos <small>experimental</small></span>
              </label>
            </div>
          </fieldset>

          <p class="setup-scoring">Puntuación: múltiplos de 5</p>
          <button id="start-game-action" type="submit" class="primary-action">Jugar</button>
        </form>
      </section>

      <div id="game-screen" class="game-screen" hidden>
        <section class="round-overview" aria-label="Estado de la ronda">
          <div class="overview-card overview-turn">
            <div id="turn-panel" class="turn-panel" aria-live="polite"></div>
          </div>
          <div class="overview-card overview-score">
            <div id="score-panel" class="score-panel"></div>
          </div>
          <div id="scoring-card" class="overview-card overview-scoring">
            <div id="scoring-panel" class="scoring-panel" aria-live="polite"></div>
          </div>
        </section>

        <div class="play-layout">
          <section class="graph-stage" aria-labelledby="board-heading">
            <div class="panel-heading">
              <h2 id="board-heading" class="visually-hidden">Mesa tradicional</h2>
              <div class="board-controls">
                <div class="view-switch" role="group" aria-label="Representación del tablero">
                  <button type="button" class="view-switch__button is-active" data-view-mode="traditional" aria-pressed="true">Tradicional</button>
                  <button type="button" class="view-switch__button" data-view-mode="ports" aria-pressed="false">Puertos</button>
                  <button type="button" class="view-switch__button" data-view-mode="graph" aria-pressed="false">Grafo</button>
                </div>
              </div>
            </div>
            <p id="selection-hint" class="selection-hint" hidden></p>
            <p id="play-feedback" class="play-feedback" aria-live="polite" hidden></p>
            <div id="board-root" class="graph-root is-traditional-view" data-view-mode="traditional"></div>
            <p id="game-message" class="game-message" aria-live="assertive"></p>
          </section>

          <section id="hand-panel" class="hand-panel" aria-label="Mano del jugador actual">
            <div id="hand-privacy" class="hand-privacy" hidden>
              <h2 id="hand-privacy-title">Turno del siguiente jugador</h2>
              <button id="reveal-hand-action" type="button" class="primary-action">Mostrar mano</button>
            </div>
            <div id="hand-content">
              <div class="panel-heading hand-heading-row">
                <h2 id="hand-heading">Tu mano</h2>
                <button id="pass-action" type="button" class="pass-action" disabled hidden>PASS</button>
              </div>
              <div id="hand-root" class="hand-grid"></div>
            </div>
          </section>

          <aside class="round-sidebar" aria-label="Información local">
            <section class="side-card counts-strip" aria-label="Fichas restantes">
              <ul id="player-counts" class="player-counts"></ul>
            </section>
            <section id="round-result" class="round-result" aria-live="polite" hidden></section>
            <section id="round-actions" class="round-actions" aria-label="Siguiente partida" hidden>
              <button id="play-again-action" type="button" class="primary-action">Jugar otra</button>
              <button id="change-config-action" type="button" class="secondary-action">Cambiar configuración</button>
            </section>
          </aside>
        </div>

      </div>
      <noscript>JavaScript es necesario para jugar esta ronda local.</noscript>
    </main>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
