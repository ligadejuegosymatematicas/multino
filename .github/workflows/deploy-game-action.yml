name: Desplegar game-action

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-game-action
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: kefdfpalennsnnfnjwpc
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar credencial de despliegue
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Falta SUPABASE_ACCESS_TOKEN::Configura este secret del repositorio antes de ejecutar el workflow."
            exit 1
          fi

      - name: Desplegar solo game-action
        run: supabase functions deploy game-action --project-ref "$SUPABASE_PROJECT_REF"
